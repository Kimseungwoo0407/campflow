name: campflow-dev

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_ORIGIN: https://kimseungwoo0407.github.io
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-campflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campflow}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: minio
      S3_ENDPOINT: http://minio:9000
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: none
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 18
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  quick-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:4000"]
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
